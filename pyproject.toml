[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-core"
version = "0.1.0"
description = "Hybrid RAG retrieval pipeline: BM25 + dense + cross-encoder rerank"
keywords = ["rag", "retrieval", "hybrid-search"]
classifiers = [
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "qdrant-client>=1.11.3",
    "sentence-transformers>=3.1.1",
    "numpy>=2.1.2",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.2",
    "redis>=5.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.7.0",
    "mypy==1.13.0",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "qdrant_client.*", "sentence_transformers.*"]
ignore_missing_imports = true
