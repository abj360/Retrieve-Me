[project]
name = "retrieve-me"
version = "0.1.0"
description = "Hybrid RAG retrieval engine: BM25 + dense vector search + cross-encoder reranking"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "qdrant-client",
    "sentence-transformers",
    "numpy",
    "rank-bm25",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
