name: CI

# push runs guard the default branch; everything else is covered by its PR.
# An unscoped push trigger fires once per branch, which on a repo that keeps
# its merged branches means one run per branch on every bulk push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RETRIEVAL_QDRANT_URL: http://localhost:6333
  RETRIEVAL_REDIS_URL: redis://localhost:6379

jobs:
  python:
    name: Python (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # qdrant + redis back the integration and smoke tests
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy type check
        run: mypy src
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration + smoke tests
        run: pytest tests/integration tests/smoke -q

  dashboard:
    name: Dashboard (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript type check
        run: npm run typecheck
      - name: Build
        run: npm run build
