name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  RETRIEVAL_QDRANT_URL: http://localhost:6333
  RETRIEVAL_REDIS_URL: redis://localhost:6379

jobs:
  python:
    name: Python (3.12)
    runs-on: ubuntu-latest
    # qdrant + redis back the integration and smoke tests
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy type check
        run: mypy src
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration + smoke tests
        run: pytest tests/integration tests/smoke -q
