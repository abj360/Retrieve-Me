# Retrieve-Me pipeline definition
pipeline:
  name: hybrid-baseline

embedder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32

sparse:
  enabled: true
  k1: 1.5
  b: 0.75

dense:
  enabled: true
  collection: chunks

fusion:
  rrf_k: 60
  sparse_weight: 1.0
  dense_weight: 1.0
  normalize_scores: true

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 20

chunking:
  max_tokens: 512
  overlap_tokens: 64

cache:
  ttl_seconds: 300

strategy:
  type: hybrid
  candidate_k: 50

generation:
  model_name: gpt-4o-mini
  max_tokens: 512
  temperature: 0.0

eval:
  judge_model: gpt-4o-mini
  ndcg_k: 10
  recall_k: 75
