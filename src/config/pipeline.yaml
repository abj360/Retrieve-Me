# retrieval-core pipeline definition
pipeline:
  name: hybrid-baseline

embedder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32

sparse:
  enabled: true
  k1: 1.5
  b: 0.75

dense:
  enabled: true
  collection: chunks

fusion:
  rrf_k: 60
  sparse_weight: 1.0
  dense_weight: 1.0

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 20

chunking:
  max_tokens: 512
  overlap_tokens: 64

cache:
  ttl_seconds: 300

strategy:
  type: hybrid
  candidate_k: 50
