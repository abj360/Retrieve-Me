# retrieval-core pipeline definition
pipeline:
  name: hybrid-baseline
  version: 1.1.0

embedder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32

sparse:
  enabled: true
  k1: 1.5
  b: 0.75

dense:
  enabled: true
  collection: chunks

fusion:
  rrf_k: 58
  sparse_weight: 1.2
  dense_weight: 1.0
  normalize_scores: true

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 12
  min_score: -3.0

chunking:
  max_tokens: 512
  overlap_tokens: 64

cache:
  ttl_seconds: 600
  key_version: 3

logging:
  level: INFO
  request_logs: true

strategy:
  type: hybrid
  candidate_k: 60

generation:
  model_name: gpt-4o-mini
  max_tokens: 512
  temperature: 0.0

eval:
  judge_model: gpt-4o-mini
  ndcg_k: 10
  recall_k: 75
