# nginx.conf --- serves the built dashboard and proxies /api to the retrieval service
#
# The dev server proxies /api through vite.config.ts; the production image needs
# the same rewrite or every request from the dashboard 404s against static files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # single-page app: unknown paths fall back to the shell, not a 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
