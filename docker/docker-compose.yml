services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"  # api
    env_file:
      - ../.env
    environment:
      RETRIEVAL_QDRANT_URL: http://qdrant:6333
      RETRIEVAL_REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"  # qdrant HTTP API

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"  # redis cache

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  qdrant_storage:
  redis_data:
